<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <meta name="color-scheme" content="light dark" />
  <title>Jr Lions Lacrosse Run Book</title>
  <meta name="description" content="The volunteer run book for Jr Lions Lacrosse — tasks, automations, and team communication in one place." />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="./brand/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./brand/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jr Lions Lacrosse" />
  <meta property="og:title" content="Jr Lions Lacrosse Run Book" />
  <meta property="og:description" content="The volunteer run book for Jr Lions Lacrosse — tasks, automations, and team communication in one place." />
  <link rel="canonical" href="https://jrlionsrunbook.vercel.app/" />
  <meta property="og:url" content="https://jrlionsrunbook.vercel.app/" />
  <meta property="og:image" content="https://jrlionsrunbook.vercel.app/brand/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Jr Lions Lacrosse logo" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jr Lions Lacrosse Run Book" />
  <meta name="twitter:description" content="The volunteer run book for Jr Lions Lacrosse — tasks, automations, and team communication in one place." />
  <meta name="twitter:image" content="https://jrlionsrunbook.vercel.app/brand/og.png" />
  <meta name="twitter:image:alt" content="Jr Lions Lacrosse logo" />
</head>
<body>
  <div id="app">
    <main class="gate boot">
      <div class="gate-card">
        <span class="logo-plate lg">
          <picture>
            <source type="image/webp" srcset="./brand/jrlions-logo-240.webp 240w, ./brand/jrlions-logo-480.webp 480w" sizes="240px" />
            <img class="brand-logo" src="./brand/jrlions-logo.png" srcset="./brand/jrlions-logo-240.png 240w, ./brand/jrlions-logo-480.png 480w" sizes="240px" alt="Jr Lions Lacrosse" width="480" height="272" fetchpriority="high" />
          </picture>
        </span>
        <p class="gate-kicker">Jr Lions Lacrosse</p>
        <h1>Welcome to the Jr Lions Run Book</h1>
        <p class="gate-sub">Loading the run book…</p>
      </div>
      <p class="gate-foot">For board members, coaches, and volunteers.</p>
    </main>
  </div>
  <noscript>
    <div style="padding:2rem;font-family:sans-serif">
      This app needs JavaScript turned on. Please enable JavaScript and reload.
    </div>
  </noscript>
  <script type="module" src="./app.js"></script>

</html>
